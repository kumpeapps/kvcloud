services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kvcloud-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --loop asyncio
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./kvcloud.db
      - SECRET_KEY=dev-secret-key
      - JWT_SECRET_KEY=dev-jwt-secret-key
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:4200,http://localhost,http://172.16.2.69:4200,http://172.16.2.69
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_EMAIL=admin@kvcloud.local
      - INITIAL_ADMIN_PASSWORD=admin123
      - INITIAL_ADMIN_FULL_NAME=Administrator
      - API_URL=http://172.16.2.69:8000
    volumes:
      - ./backend:/app
    networks:
      - kvcloud-network
    restart: unless-stopped
    privileged: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kvcloud-frontend-dev
    working_dir: /app
    command: sh -c "npx ng serve --host 0.0.0.0 --disable-host-check"
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://172.16.2.69:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/angular.json:/app/angular.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
    networks:
      - kvcloud-network
    restart: unless-stopped

networks:
  kvcloud-network:
    driver: bridge
