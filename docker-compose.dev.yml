version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kvcloud-backend-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./kvcloud.db
      - SECRET_KEY=dev-secret-key
      - JWT_SECRET_KEY=dev-jwt-secret-key
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:4200,http://localhost
    volumes:
      - ./backend:/app
    networks:
      - kvcloud-network
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: kvcloud-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kvcloud-network
    restart: unless-stopped

networks:
  kvcloud-network:
    driver: bridge
