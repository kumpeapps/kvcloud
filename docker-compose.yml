services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kvcloud-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kvcloud:kvcloud@db:5432/kvcloud
      - SECRET_KEY=change-this-in-production
      - JWT_SECRET_KEY=change-this-jwt-secret-in-production
      - CORS_ORIGINS=https://localhost,https://localhost:443
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_EMAIL=admin@kvcloud.local
      - INITIAL_ADMIN_PASSWORD=changeme
      - INITIAL_ADMIN_FULL_NAME=Administrator
      - API_URL=https://localhost:8000
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - kvcloud-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kvcloud-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_URL=/api
      - PROXY_BACKEND=true
      - SSL_CERT_DIR=/etc/ssl/certs/kvcloud
      - SSL_CERT_FILE=server.crt
      - SSL_KEY_FILE=server.key
      - SSL_DOMAIN=localhost
    volumes:
      - ssl-certs:/etc/ssl/certs/kvcloud
    depends_on:
      - backend
    networks:
      - kvcloud-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: kvcloud-db
    environment:
      - POSTGRES_USER=kvcloud
      - POSTGRES_PASSWORD=kvcloud
      - POSTGRES_DB=kvcloud
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kvcloud-network
    restart: unless-stopped

networks:
  kvcloud-network:
    driver: bridge

volumes:
  postgres-data:
  ssl-certs:
