<div class="roles-container">
  <div class="header">
    <div class="header-content">
      <h1>Role Management</h1>
      <p class="subtitle">Define roles and their permissions</p>
    </div>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Create Role
    </button>
  </div>

  <app-loading-spinner *ngIf="loading()" message="Loading roles..."></app-loading-spinner>
  
  <app-error-display 
    *ngIf="error() && !loading()" 
    [error]="error()" 
    [showRetry]="true"
    (retry)="loadRoles()">
  </app-error-display>

  <mat-card *ngIf="!loading() && !error()" class="table-card">
    <mat-card-content>
      <div class="table-controls">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search roles</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Role name, description...">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Role Name</th>
            <td mat-cell *matCellDef="let role">
              <div class="role-cell">
                <mat-icon class="role-icon">shield</mat-icon>
                <span class="role-name">{{ role.name }}</span>
              </div>
            </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let role">{{ role.description || '-' }}</td>
          </ng-container>

          <!-- Permissions Column -->
          <ng-container matColumnDef="permissions">
            <th mat-header-cell *matHeaderCellDef>Permissions</th>
            <td mat-cell *matCellDef="let role">
              <mat-chip-set>
                <mat-chip>{{ formatPermissions(role.permissions) }}</mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <!-- Created Column -->
          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let role">{{ formatDate(role.created_at) }}</td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let role">
              <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Actions">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openEditDialog(role)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="deleteRole(role)" class="danger">
                  <mat-icon color="warn">delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No Data Row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
              <div class="no-data-content">
                <mat-icon>shield</mat-icon>
                <p>No roles found</p>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator 
        [pageSizeOptions]="[10, 25, 50, 100]"
        [pageSize]="25"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
