<div class="clusters-container">
  <app-loading-spinner *ngIf="loading()" message="Loading clusters..."></app-loading-spinner>

  <div *ngIf="!loading()" class="clusters-content">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>Proxmox Clusters</h1>
        <p class="subtitle">Manage your Proxmox clusters and nodes</p>
      </div>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Add Cluster
      </button>
    </div>

    <!-- Error Message -->
    <mat-card *ngIf="error()" class="error-card">
      <mat-card-content>
        <mat-icon color="warn">error</mat-icon>
        {{ error() }}
      </mat-card-content>
    </mat-card>

    <!-- Empty State -->
    <mat-card *ngIf="!error() && clusters().length === 0" class="empty-state">
      <mat-card-content>
        <mat-icon>storage</mat-icon>
        <h2>No Clusters Configured</h2>
        <p>Get started by adding your first Proxmox cluster</p>
        <button mat-raised-button color="primary" (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>
          Add Cluster
        </button>
      </mat-card-content>
    </mat-card>

    <!-- Clusters Grid -->
    <div *ngIf="!error() && clusters().length > 0" class="clusters-grid">
      <mat-card *ngFor="let cluster of clusters()" class="cluster-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>storage</mat-icon>
          <mat-card-title>{{ cluster.name }}</mat-card-title>
          <mat-card-subtitle>{{ cluster.description || 'No description' }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="cluster-status">
            <app-status-badge 
              [status]="cluster.is_active ? 'success' : 'default'"
              [label]="cluster.is_active ? 'Active' : 'Inactive'">
            </app-status-badge>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary" [routerLink]="['/clusters', cluster.id]">
            <mat-icon>visibility</mat-icon>
            View Details
          </button>
          <button mat-button (click)="openEditDialog(cluster)">
            <mat-icon>edit</mat-icon>
            Edit
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
