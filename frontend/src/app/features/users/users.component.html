<div class="users-container">
  <div class="header">
    <div class="header-content">
      <h1>User Management</h1>
      <p class="subtitle">Manage system users and their permissions</p>
    </div>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Create User
    </button>
  </div>

  <app-loading-spinner *ngIf="loading()" message="Loading users..."></app-loading-spinner>
  
  <app-error-display 
    *ngIf="error() && !loading()" 
    [error]="error()" 
    [showRetry]="true"
    (retry)="loadUsers()">
  </app-error-display>

  <mat-card *ngIf="!loading() && !error()" class="table-card">
    <mat-card-content>
      <div class="table-controls">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search users</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Username, email, name...">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Username Column -->
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
            <td mat-cell *matCellDef="let user">
              <div class="user-cell">
                <mat-icon class="user-icon">person</mat-icon>
                <span class="username">{{ user.username }}</span>
                <mat-icon *ngIf="user.is_superuser" class="admin-badge" color="warn" matTooltip="Administrator">
                  admin_panel_settings
                </mat-icon>
              </div>
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <!-- Full Name Column -->
          <ng-container matColumnDef="full_name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Full Name</th>
            <td mat-cell *matCellDef="let user">{{ user.full_name || '-' }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="is_active">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let user">
              <app-status-badge 
                [status]="getUserStatusType(user.is_active)"
                [label]="getUserStatusLabel(user.is_active)">
              </app-status-badge>
            </td>
          </ng-container>

          <!-- Role Column -->
          <ng-container matColumnDef="is_superuser">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
            <td mat-cell *matCellDef="let user">
              <mat-chip *ngIf="user.is_superuser" color="accent">Admin</mat-chip>
              <mat-chip *ngIf="!user.is_superuser">User</mat-chip>
            </td>
          </ng-container>

          <!-- Created Column -->
          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let user">{{ formatDate(user.created_at) }}</td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Actions">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openEditDialog(user)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item (click)="manageQuota(user)">
                  <mat-icon>account_box</mat-icon>
                  <span>Manage Quota</span>
                </button>
                <button mat-menu-item (click)="toggleUserStatus(user)">
                  <mat-icon>{{ user.is_active ? 'block' : 'check_circle' }}</mat-icon>
                  <span>{{ user.is_active ? 'Deactivate' : 'Activate' }}</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="deleteUser(user)" class="danger">
                  <mat-icon color="warn">delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No Data Row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
              <div class="no-data-content">
                <mat-icon>group</mat-icon>
                <p>No users found</p>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator 
        [pageSizeOptions]="[10, 25, 50, 100]"
        [pageSize]="25"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
